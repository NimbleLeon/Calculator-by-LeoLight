<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Анимированный фон -->
    <div class="animated-bg">
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="grid-lines"></div>
    </div>

    <!-- Кастомный курсор -->
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Основной контейнер -->
    <div class="container">
        <!-- Заголовок -->
        <header class="calculator-header">
            <h1 class="title">
                <span class="title-text">NEO</span>
                <span class="title-glow">CALC</span>
            </h1>
            <p class="subtitle">Современный калькулятор</p>
        </header>

        <!-- Калькулятор -->
        <main class="calculator">
            <!-- Дисплей -->
            <div class="display-container">
                <div class="display-glass">
                    <div class="display-content">
                        <div class="previous-operation" id="previousOperation"></div>
                        <div class="current-operation" id="currentOperation">0</div>
                    </div>
                    <div class="display-glow"></div>
                </div>
            </div>

            <!-- Клавиатура -->
            <div class="keyboard">
                <!-- Первый ряд -->
                <button class="btn btn-function btn-clear" data-action="clear">
                    <span class="btn-text">C</span>
                    <div class="btn-glow"></div>
                    <div class="btn-sparkle"></div>
                </button>
                <button class="btn btn-function" data-action="backspace">
                    <span class="btn-text">⌫</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-function" data-action="percentage">
                    <span class="btn-text">%</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-operator" data-operator="÷">
                    <span class="btn-text">÷</span>
                    <div class="btn-glow"></div>
                </button>

                <!-- Второй ряд -->
                <button class="btn btn-number" data-number="7">
                    <span class="btn-text">7</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="8">
                    <span class="btn-text">8</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="9">
                    <span class="btn-text">9</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-operator" data-operator="×">
                    <span class="btn-text">×</span>
                    <div class="btn-glow"></div>
                </button>

                <!-- Третий ряд -->
                <button class="btn btn-number" data-number="4">
                    <span class="btn-text">4</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="5">
                    <span class="btn-text">5</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="6">
                    <span class="btn-text">6</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-operator" data-operator="-">
                    <span class="btn-text">-</span>
                    <div class="btn-glow"></div>
                </button>

                <!-- Четвертый ряд -->
                <button class="btn btn-number" data-number="1">
                    <span class="btn-text">1</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="2">
                    <span class="btn-text">2</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number="3">
                    <span class="btn-text">3</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-operator" data-operator="+">
                    <span class="btn-text">+</span>
                    <div class="btn-glow"></div>
                </button>

                <!-- Пятый ряд -->
                <button class="btn btn-number btn-zero" data-number="0">
                    <span class="btn-text">0</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-number" data-number=".">
                    <span class="btn-text">.</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="btn btn-equals" data-action="calculate">
                    <span class="btn-text">=</span>
                    <div class="btn-glow"></div>
                    <div class="btn-pulse"></div>
                </button>
            </div>
        </main>

        <!-- Дополнительные функции -->
        <div class="extra-features">
            <button class="feature-btn" id="themeToggle">
                <span class="feature-icon">🌙</span>
                <span class="feature-text">Стиль</span>
            </button>
            <button class="feature-btn" id="historyToggle">
                <span class="feature-icon">📊</span>
                <span class="feature-text">История</span>
            </button>
            <button class="feature-btn" id="soundToggle">
                <span class="feature-icon">🔊</span>
                <span class="feature-text">Звук</span>
            </button>
        </div>

        <!-- Панель истории -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>История вычислений</h3>
                <button class="history-clear" id="clearHistory">Очистить</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- История будет добавляться здесь -->
            </div>
        </div>
    </div>

    <!-- Аудио элементы для звуков -->
    <audio id="clickSound" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=="></audio>
    <audio id="equalsSound" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=="></audio>

    <script src="script.js"></script>
</body>
</html>
